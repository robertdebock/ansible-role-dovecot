---
# vars file for dovecot

_dovecot_packages:
  default:
    - dovecot
  Alpine:
    - dovecot
    - dovecot-pop3d
  Debian:
    - dovecot-core
    - dovecot-imapd
    - dovecot-pop3d

dovecot_packages: "{{ _dovecot_packages[ansible_facts['os_family']] | default(_dovecot_packages['default']) }}"

dovecot_service: dovecot

# Dovecot 2.4 replaced `mail_location` by `mail_driver`, `mail_path` and
# `mail_inbox_path`.
_dovecot_mail_location_style:
  default: legacy
  Debian-13: split

dovecot_mail_location_style: "{{ _dovecot_mail_location_style[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_dovecot_mail_location_style['default']) }}"
