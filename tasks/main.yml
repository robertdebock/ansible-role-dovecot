---
# tasks file for dovecot

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install dovecot
  ansible.builtin.package:
    name: "{{ dovecot_packages }}"
    state: present
  notify:
    - Copy sample configuration

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Configure mail_location
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^mail_location"
    line: "mail_location = {{ dovecot_mailbox_location }}"
    mode: "0640"
  when:
    - dovecot_mail_location_style == "legacy"

- name: Configure mail_driver, mail_path and mail_inbox_path
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^{{ item.name }}"
    line: "{{ item.name }} = {{ item.value }}"
    mode: "0640"
  loop:
    - name: mail_driver
      value: "{{ dovecot_mail_driver }}"
    - name: mail_path
      value: "{{ dovecot_mail_path }}"
    - name: mail_inbox_path
      value: "{{ dovecot_mail_inbox_path }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - dovecot_mail_location_style == "split"

- name: Configure mail_access_groups
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^mail_access_groups"
    line: "mail_access_groups = {{ dovecot_mail_access_groups }}"
    mode: "0640"

- name: Find users in /var/spool/mail
  ansible.builtin.find:
    path: /var/spool/mail
  register: dovecot_find_users

- name: Set permission in /var/spool/mail
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ dovecot_find_users.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Start and enable dovecot
  ansible.builtin.service:
    name: "{{ dovecot_service }}"
    state: started
    enabled: true
