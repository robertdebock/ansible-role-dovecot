---
# tasks file for dovecot

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install dovecot
  ansible.builtin.package:
    name: "{{ dovecot_packages }}"
    state: present
  notify:
    - Copy sample configuration

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create /etc/dovecot/conf.d
  ansible.builtin.file:
    path: /etc/dovecot/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - dovecot_mail_location_style == "split"

- name: Create a minimal dovecot.conf
  ansible.builtin.copy:
    dest: /etc/dovecot/dovecot.conf
    content: |
      dovecot_config_version = 2.4.0
      dovecot_storage_version = 2.4.0
      ssl_server {
        cert_file = /etc/dovecot/dovecot.pem
        key_file = /etc/dovecot/dovecot.key
      }
      ssl = yes
      !include_try conf.d/*.conf
    owner: root
    group: root
    mode: "0644"
    force: false
  when:
    - dovecot_create_main_configuration | bool

- name: Create a self-signed certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -nodes -days 3650
      -subj "/CN={{ ansible_facts['fqdn'] }}"
      -keyout /etc/dovecot/dovecot.key -out /etc/dovecot/dovecot.pem
    creates: /etc/dovecot/dovecot.pem
  when:
    - dovecot_create_main_configuration | bool

- name: Enable the imap and pop3 protocols
  ansible.builtin.copy:
    dest: /etc/dovecot/conf.d/20-protocols.conf
    content: |
      protocols {
        imap = yes
        pop3 = yes
      }
    owner: root
    group: root
    mode: "0644"
  when:
    - dovecot_mail_location_style == "split"

- name: Configure mail_location
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^mail_location"
    line: "mail_location = {{ dovecot_mailbox_location }}"
    mode: "0640"
  when:
    - dovecot_mail_location_style == "legacy"

- name: Configure mail_driver, mail_path and mail_inbox_path
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^{{ item.name }}"
    line: "{{ item.name }} = {{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0640"
  loop:
    - name: mail_driver
      value: "{{ dovecot_mail_driver }}"
    - name: mail_path
      value: "{{ dovecot_mail_path }}"
    - name: mail_inbox_path
      value: "{{ dovecot_mail_inbox_path }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - dovecot_mail_location_style == "split"

- name: Configure mail_access_groups
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: "^mail_access_groups"
    line: "mail_access_groups = {{ dovecot_mail_access_groups }}"
    mode: "0640"

- name: Find users in /var/spool/mail
  ansible.builtin.find:
    path: /var/spool/mail
  register: dovecot_find_users

- name: Set permission in /var/spool/mail
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ dovecot_find_users.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Start and enable dovecot
  ansible.builtin.service:
    name: "{{ dovecot_service }}"
    state: started
    enabled: true
